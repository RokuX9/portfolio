<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio</title>
    <style>
      #portrait-warning {
        display: none;
      }
      /* On mobile devices in portrait mode, show the warning overlay */
      @media screen and (max-width: 900px) and (orientation: portrait) {
        #portrait-warning {
          display: flex;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #000;
          color: #fff;
          z-index: 9999;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: sans-serif;
          text-align: center;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="portrait-warning">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 20px;">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
        <path d="M4 12v-2a4 4 0 0 1 4-4h8"></path>
      </svg>
      <h2>Please Rotate Your Device</h2>
      <p style="margin-top: 10px; opacity: 0.8;">This 3D experience requires landscape mode to view properly.</p>
    </div>
    <div id="app"></div>
    <select id="room-selector" style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 10px; font-size: 16px; font-family: sans-serif; cursor: pointer; border-radius: 5px; background: rgba(0,0,0,0.7); color: white; border: 1px solid white;">
      <option value="hall">About Me</option>
      <option value="roomA">Around the World</option>
      <option value="roomB">News Explorer</option>
      <option value="roomC">Quick Chat</option>
    </select>
    <canvas id="bg"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
